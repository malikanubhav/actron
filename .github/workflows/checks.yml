name: Actron checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACTRON_REDIS_URL: redis://127.0.0.1:6389/0
    services:
      falkordb:
        image: falkordb/falkordb:v4.12.0
        env:
          BROWSER: '0'
          REDIS_ARGS: --appendonly yes
        ports:
          - 6389:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install pinned uv and locked dependencies
        run: |
          python -m pip install uv==0.12.3
          uv sync --frozen --group dev --python 3.12
      - name: Typecheck
        run: uv run --frozen --group dev --python 3.12 mypy actron
      - name: Lint
        run: uv run --frozen --group dev --python 3.12 ruff check actron tests scripts/check_persistence.py
      - name: Test with real FalkorDB and disposable repositories
        run: uv run --frozen --group dev --python 3.12 pytest
      - name: Verify deployment persistence across container replacement
        run: uv run --frozen --group dev --python 3.12 python scripts/check_persistence.py
