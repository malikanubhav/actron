[project]
name = "actron"
version = "0.1.0"
description = "Evidence-backed Slack to Linear to tested GitHub delivery"
requires-python = ">=3.12"
dependencies = ["redis>=5.2,<7"]

[project.scripts]
actron = "actron.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "mypy>=1.15,<2", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
files = ["actron"]

[tool.ruff]
target-version = "py312"
line-length = 100
