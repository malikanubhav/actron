services:
  falkordb:
    image: falkordb/falkordb:v4.12.0
    ports:
      - "127.0.0.1:${FALKORDB_PORT:-6389}:6379"
    volumes:
      - falkor-data:/var/lib/falkordb/data
    environment:
      REDIS_ARGS: "--appendonly yes"
      BROWSER: "0"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped
volumes:
  falkor-data:
