# Labelled request/decision pairs for J6 judge_conflict (spec A, A-AC-77; PRD 10.4 thresholds).
# Synthetic, written for this test suite in the style of a Clojure VS Code extension. Not product data.
# label: conflict (doing the request breaks the decision), possible_conflict (might, depends on details),
#        none (supports it, unrelated, or explicitly replaces it).
cases:
  - {id: C01, label: conflict, request: "Turn on format-on-paste by default for everyone.", decision: {statement: "Format on paste stays off by default.", quote: "we keep format-on-paste off by default", status: approved}}
  - {id: C02, label: conflict, request: "Remove the legacy paredit keybindings.", decision: {statement: "Legacy paredit keybindings stay available behind a setting.", quote: "legacy bindings stay, behind calva.paredit.defaultKeyMap", status: approved}}
  - {id: C03, label: conflict, request: "Auto-start jack-in when a Clojure file opens.", decision: {statement: "Jack-in only starts when the user asks for it.", quote: "never start a REPL without the user asking", status: approved}}
  - {id: C04, label: conflict, request: "Send anonymous usage statistics on startup.", decision: {statement: "Calva collects no telemetry.", quote: "no telemetry, ever", status: approved}}
  - {id: C05, label: conflict, request: "Bundle our own clojure-lsp fork instead of downloading releases.", decision: {statement: "Calva downloads official clojure-lsp releases only.", quote: "we only ship official clojure-lsp builds", status: approved}}
