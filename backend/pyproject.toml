[project]
name = "actron"
version = "0.1.0"
description = "Checks team history in a graph before an AI writes code, from Slack request to PR"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "falkordb",
  "httpx",
  "pydantic",
  "pydantic-settings",
  "pyyaml",
  "python-dotenv",
  "slack-bolt",
  "slack-sdk",
  "aiohttp",
  "litellm",
  "tree-sitter",
  "tree-sitter-language-pack",
  "temporalio",
  "sqlalchemy[asyncio]>=2",
  "alembic",
  "psycopg[binary]",
  "redis",
  "cryptography",
  "mcp",
  "python-ulid",
  "sse-starlette",
  "python-multipart",
  "pyjwt[crypto]",
  "typesafe-sdk>=0.7.5",
]

[project.scripts]
actron = "actron.cli:main"

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-timeout",
  "hypothesis",
  "respx",
  "ruff",
  "mypy",
  "types-pyyaml",
  "types-redis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["actron"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# E501: `ruff format` wraps code at 100; long docstring and comment lines are not worth hand-wrapping.
ignore = ["RUF001", "RUF002", "RUF003", "B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: needs real provider keys or network (opt-in)",
  "slow: long-running integration tests",
  "integration: needs the compose stack (FalkorDB, PostgreSQL, Redis, Temporal)",
]
addopts = "-m 'not live'"
